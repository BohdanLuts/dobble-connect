<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dobble Connect">
    <meta name="description" content="Offline live shared-symbol finder for Dobble Connect cards.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icon.svg">
    <link rel="stylesheet" href="./style.css">
    <title>Dobble Connect</title>
  </head>
  <body>
    <main id="camera-view" aria-label="Live camera match finder">
      <video id="camera" autoplay muted playsinline disablepictureinpicture></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div id="status" role="status" aria-live="polite">Tap Start camera</div>
      <section id="error" hidden>
        <strong>Camera unavailable</strong>
        <span id="error-message"></span>
      </section>
      <button id="retry" type="button">Start camera</button>
    </main>
    <script>
      (function () {
        var button = document.getElementById('retry');
        var video = document.getElementById('camera');
        var status = document.getElementById('status');
        var errorPanel = document.getElementById('error');
        var errorMessage = document.getElementById('error-message');
        var starting = false;

        function fail(error) {
          starting = false;
          button.hidden = false;
          status.hidden = false;
          status.textContent = 'Camera error';
          errorPanel.hidden = false;
          errorMessage.textContent = (error && error.name ? error.name + ': ' : '') + (error && error.message ? error.message : 'Could not start camera.');
        }

        button.addEventListener('click', function () {
          if (starting || (video.srcObject && video.srcObject.active)) return;
          if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            fail(new Error('Camera API is unavailable. Open this HTTPS page in Safari.'));
            return;
          }
          starting = true;
          button.hidden = true;
          errorPanel.hidden = true;
          status.hidden = false;
          status.textContent = 'Requesting camera…';

          navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } })
            .catch(function (error) {
              if (error && (error.name === 'OverconstrainedError' || error.name === 'NotFoundError')) {
                return navigator.mediaDevices.getUserMedia({ audio: false, video: true });
              }
              throw error;
            })
            .then(function (mediaStream) {
              video.muted = true;
              video.setAttribute('playsinline', '');
              video.srcObject = mediaStream;
              status.textContent = 'Starting video…';
              return video.play().then(function () { return mediaStream; });
            })
            .then(function (mediaStream) {
              starting = false;
              status.textContent = 'Searching…';
              window.dispatchEvent(new CustomEvent('dobble-camera-ready', { detail: mediaStream }));
            })
            .catch(fail);
        });
      }());
    </script>
    <script type="module" src="./app.js?v=3"></script>
  </body>
</html>
